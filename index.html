<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="A simple To-Do List WebApp.">
    <title>To-Do List</title>

    <link href="https://fonts.googleapis.com/css2?family=Work+Sans:wght@300&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.12.0-2/css/all.min.css"
        integrity="sha256-46r060N2LrChLLb5zowXQ72/iKKNiw/lAmygmHExk/o=" crossorigin="anonymous" />

    <link rel="stylesheet" href="CSS/main.css">
</head>

<body>
    <main>
        <h1>To-Do List</h1>
        
        <form>
            <label for="todo-input" class="visually-hidden">Add a new task</label>
            <input id="todo-input" class="todo-input" type="text" name="todo" placeholder="Add a task..." aria-label="Task input">
            <button class="todo-btn" type="submit">Add</button>
        </form>

        <ul class="todo-list" aria-label="To-do list">
        </ul>
    </main>

    <!-- Wheel Modal -->
    <div id="wheel-modal" class="wheel-modal">
        <div class="wheel-modal-content">
            <span class="wheel-close">&times;</span>
            <h2>Spin the Wheel!</h2>
            <div class="wheel-container">
                <canvas id="wheel-canvas" width="400" height="400"></canvas>
                <div class="wheel-pointer"></div>
            </div>
            <div id="wheel-result" class="wheel-result"></div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <script src="JS/main.js"></script>
</body>
</html>
